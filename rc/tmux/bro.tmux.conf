# bro-toolkit tmux config. Source-filed from ~/.tmux.conf via a marker block.
# Edit here, then reload with:  tmux source-file ~/.tmux.conf

# ---- pane brightness --------------------------------------------------------
# Active pane: full brightness. Inactive panes: visibly dimmer so the eye lands
# on the focused one immediately.
set -g window-active-style 'fg=terminal,bg=terminal'
set -g window-style        'fg=colour240,bg=terminal'

# ---- pane borders -----------------------------------------------------------
# Always show pane index + title on the top border. Active border is bold blue.
set -g pane-border-status top
set -g pane-border-format ' #[bold]#{pane_index}#[default] #{pane_title} '
set -g pane-active-border-style 'fg=colour33,bold'
set -g pane-border-style        'fg=colour240'

# ---- indexing ---------------------------------------------------------------
# 1-based so Alt+1..5 maps to what you actually see.
set -g base-index 1
set -g pane-base-index 1

# Flash pane numbers (prefix+q) longer so they're actually readable.
set -g display-panes-time 2000

# ---- navigation -------------------------------------------------------------
# Alt+arrow: move between panes, no prefix.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Alt+1..5: jump to pane by index, no prefix.
bind -n M-1 select-pane -t 1
bind -n M-2 select-pane -t 2
bind -n M-3 select-pane -t 3
bind -n M-4 select-pane -t 4
bind -n M-5 select-pane -t 5

# Alt+p: toggle last pane, no prefix.
bind -n M-p last-pane
